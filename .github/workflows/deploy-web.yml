name: Build Emscripten (SDL3) & Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build and install SDL3 & SDL3_mixer for Emscripten
        run: |
          # Build SDL3 static library into emsdk sysroot
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          emcmake cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL3/build -j$(nproc)
          cmake --install /tmp/SDL3/build

          # Build SDL3_mixer static library into emsdk sysroot
          git clone --depth 1 https://github.com/libsdl-org/SDL_mixer.git /tmp/SDL3_mixer
          emcmake cmake -S /tmp/SDL3_mixer -B /tmp/SDL3_mixer/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDLMIXER_VENDORED=ON \
            -DSDLMIXER_OPUS=OFF \
            -DSDLMIXER_FLAC=OFF \
            -DSDLMIXER_MOD=OFF \
            -DSDLMIXER_MIDI=OFF \
            -DSDLMIXER_WAVPACK=OFF
          cmake --build /tmp/SDL3_mixer/build -j$(nproc)
          cmake --install /tmp/SDL3_mixer/build

      - name: Configure and build HCL (SDL3)
        run: |
          mkdir -p docs
          emcmake cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SDL3=ON
          cmake --build build -j$(nproc)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
