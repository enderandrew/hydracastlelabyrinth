name: Build Emscripten & Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure with emcmake
        run: |
          emcmake cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXECUTABLE_SUFFIX=".html"

      - name: Fix -std=c++11 in C flags and compile
        run: |
          # Remove -std=c++11 from C_FLAGS so emcc doesn't reject .c files
          sed -i 's/-std=c++11//g' build/CMakeFiles/hcl.dir/flags.make
          cmake --build build -j$(nproc)

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p dist
          cp build/*.html build/*.js build/*.wasm dist/
          if ls build/*.data 1> /dev/null 2>&1; then
            cp build/*.data dist/
          fi

          # Rename the main output HTML to index.html for GitHub Pages
          MAIN_HTML=$(find dist -maxdepth 1 -name "*.html" ! -name "index.html" | head -n 1)
          if [ -n "$MAIN_HTML" ]; then
            mv "$MAIN_HTML" dist/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
