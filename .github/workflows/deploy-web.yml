name: Build Emscripten (SDL3) & Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build SDL3 from source (if not vendored in repo)
        run: |
          # If your fork already vendors SDL3 via FetchContent/add_subdirectory,
          # CMake will use that. Otherwise, this builds and installs SDL3 into the emsdk sysroot.
          if [ ! -d "external/SDL" ] && [ ! -d "SDL" ]; then
            git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL.git /tmp/SDL3
            emcmake cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL_SHARED=OFF \
              -DSDL_STATIC=ON \
              -DSDL_TEST_LIBRARY=OFF
            cmake --build /tmp/SDL3/build -j$(nproc)
            cmake --install /tmp/SDL3/build
          fi

      - name: Configure with emcmake
        run: |
          emcmake cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SDL3=ON \
            -DCMAKE_EXECUTABLE_SUFFIX=".html" \
            -DCMAKE_EXE_LINKER_FLAGS="-sUSE_SDL=0 -sALLOW_MEMORY_GROWTH=1 -sASYNCIFY --preload-file data@/data"

      - name: Compile with CMake
        run: cmake --build build -j$(nproc)

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p dist
          # Copy compiled HTML, JS, WASM, and preloaded data files
          cp build/*.html build/*.js build/*.wasm dist/
          if ls build/*.data 1> /dev/null 2>&1; then
            cp build/*.data dist/
          fi

          # Rename the main output HTML to index.html for GitHub Pages
          MAIN_HTML=$(find dist -maxdepth 1 -name "*.html" ! -name "index.html" | head -n 1)
          if [ -n "$MAIN_HTML" ]; then
            mv "$MAIN_HTML" dist/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
