name: Build Emscripten (SDL2) & Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure and compile with emcmake
        run: |
          mkdir -p docs build
          # file_packager looks for 'data' inside the build working directory
          ln -sfn "$PWD/data" build/data

          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

          # 1. Strip -std=c++11 from C flags (clang/emcc rejects it on .c files)
          sed -i 's/-std=c++11//g' build/CMakeFiles/hcl.dir/flags.make
          # 2. Fix OUTPUT_NAME "index.html" + default .js suffix -> "index.html"
          sed -i 's/index\.html\.js/index.html/g' build/CMakeFiles/hcl.dir/build.make build/CMakeFiles/hcl.dir/link.txt

          cmake --build build -j$(nproc)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
